# ============================================================
# Shell and terminal
# ============================================================

set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish

if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'

set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',alacritty:RGB'
set -as terminal-features ',kitty:RGB'

set -sg escape-time 10
set -g focus-events on
set -g history-limit 100000
set -g mouse on
set -g set-clipboard external


# ============================================================
# Indexes and session behavior
# ============================================================

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g detach-on-destroy off
set -g exit-empty on

set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'


# ============================================================
# Prefix
# ============================================================

set -g prefix C-a
unbind C-b

bind C-a send-prefix


# ============================================================
# Status bar
# ============================================================

set -g status on
set -g status-position top
set -g status-justify centre
set -g status-interval 5

set -g status-left-length 80
set -g status-right-length 120

set -g status-style 'bg=colour238,fg=colour255'

set -g status-left \
  '#[fg=colour16,bg=colour81,bold] #S #[fg=colour255,bg=colour238] #H:#P '

set -g status-right \
  '#[fg=colour245]#(wifi) #(battery --tmux) #[fg=colour255][%Y-%m-%d(%a) %H:%M] '

set -g window-status-separator ''

setw -g window-status-format \
  '#[fg=colour245,bg=colour238] #I:#W#F '

setw -g window-status-current-format \
  '#[fg=colour16,bg=colour37,bold] #I:#W#F '

setw -g window-status-activity-style \
  'fg=colour81,bold'

setw -g window-status-bell-style \
  'fg=colour196,bold'


# ============================================================
# Messages and command prompt
# ============================================================

set -g message-style 'bg=colour81,fg=colour16,bold'
set -g message-command-style 'bg=colour238,fg=colour255'

set -g display-time 2000
set -g display-panes-time 1500


# ============================================================
# Pane borders
# ============================================================

setw -g pane-border-style 'fg=colour240'
setw -g pane-active-border-style 'fg=colour81'

setw -g pane-border-status top
setw -g pane-border-format \
  ' #[fg=colour81,bold]#P #[fg=colour250]#{pane_current_command} #[fg=colour245]#{b:pane_current_path} '


# ============================================================
# Pane navigation
# ============================================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind Tab select-pane -l

bind z resize-pane -Z
bind q display-panes

bind -r '<' swap-pane -U
bind -r '>' swap-pane -D

bind b break-pane
bind B command-prompt \
  -p 'Join pane from:' \
  'join-pane -s "%%"'


# ============================================================
# Window navigation
# ============================================================

bind -r C-h previous-window
bind -r C-l next-window

bind -r M-h swap-window -t -1
bind -r M-l swap-window -t +1

bind n next-window
bind N previous-window

bind "'" command-prompt \
  -p 'Window index:' \
  'select-window -t "%%"'


# ============================================================
# Session navigation
# ============================================================

bind -r C-j switch-client -p
bind -r C-k switch-client -n

bind '$' command-prompt \
  -I '#S' \
  -p 'Rename session:' \
  'rename-session -- "%%"'


# ============================================================
# Split and window creation
# ============================================================

unbind '"'
unbind %

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

bind c new-window -c '#{pane_current_path}'

bind e select-layout even-horizontal
bind E select-layout even-vertical
bind t select-layout tiled
bind m select-layout main-vertical
bind M select-layout main-horizontal

bind Space next-layout


# ============================================================
# FZF pickers
# ============================================================

bind s display-popup \
  -E \
  -w 80% \
  -h 70% \
  -T ' sessions ' \
  '/usr/bin/fish ~/.config/tmux/menu.fish session'

bind w display-popup \
  -E \
  -w 90% \
  -h 75% \
  -T ' windows ' \
  '/usr/bin/fish ~/.config/tmux/menu.fish window'

bind f display-popup \
  -E \
  -w 90% \
  -h 75% \
  -T ' panes ' \
  '/usr/bin/fish ~/.config/tmux/menu.fish pane'


# ============================================================
# Popups
# ============================================================

bind p display-popup \
  -E \
  -w 90% \
  -h 80% \
  -d '#{pane_current_path}' \
  -T ' shell ' \
  /usr/bin/fish

bind C-p display-popup \
  -E \
  -w 95% \
  -h 90% \
  -d '#{pane_current_path}' \
  -T ' shell ' \
  /usr/bin/fish


# ============================================================
# Main command menu
# ============================================================

bind C-Space display-menu \
  -T ' tmux ' \
  -x C \
  -y C \
  'New window'         c 'new-window -c "#{pane_current_path}"' \
  'Split horizontal'   h 'split-window -h -c "#{pane_current_path}"' \
  'Split vertical'     v 'split-window -v -c "#{pane_current_path}"' \
  '' \
  'Sessions'           s 'display-popup -E -w 80% -h 70% -T " sessions " "/usr/bin/fish ~/.config/tmux/menu.fish session"' \
  'Windows'            w 'display-popup -E -w 90% -h 75% -T " windows " "/usr/bin/fish ~/.config/tmux/menu.fish window"' \
  'Panes'              p 'display-popup -E -w 90% -h 75% -T " panes " "/usr/bin/fish ~/.config/tmux/menu.fish pane"' \
  'Shell popup'        x 'display-popup -E -w 90% -h 80% -d "#{pane_current_path}" -T " shell " /usr/bin/fish' \
  '' \
  'Tiled layout'       t 'select-layout tiled' \
  'Main vertical'      m 'select-layout main-vertical' \
  'Main horizontal'    M 'select-layout main-horizontal' \
  'Even horizontal'    e 'select-layout even-horizontal' \
  'Even vertical'      E 'select-layout even-vertical' \
  '' \
  'Rename window'      r 'command-prompt -I "#W" -p "Rename window:" "rename-window -- \"%%\""' \
  'Rename session'     R 'command-prompt -I "#S" -p "Rename session:" "rename-session -- \"%%\""' \
  'Reload config'      C-r 'source-file ~/.tmux.conf'


# ============================================================
# Reload and configuration
# ============================================================

bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

bind C-e new-window \
  -n tmux.conf \
  -c '#{pane_current_path}' \
  '$EDITOR ~/.tmux.conf'


# ============================================================
# Destructive actions
# ============================================================

bind x confirm-before \
  -p 'Kill pane #P? (y/n)' \
  kill-pane

bind X confirm-before \
  -p 'Kill window #I:#W? (y/n)' \
  kill-window

bind C-x confirm-before \
  -p 'Kill session #S? (y/n)' \
  kill-session


# ============================================================
# Copy mode
# ============================================================

setw -g mode-keys vi
set -g status-keys vi

bind [ copy-mode
bind ] paste-buffer
bind C-p paste-buffer

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-line-and-cancel

bind -T copy-mode-vi Escape send-keys -X cancel

bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom

bind -T copy-mode-vi / command-prompt \
  -i \
  -p 'Search down:' \
  'send-keys -X search-forward "%%"'

bind -T copy-mode-vi '?' command-prompt \
  -i \
  -p 'Search up:' \
  'send-keys -X search-backward "%%"'

bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-reverse


# ============================================================
# Mouse behavior
# ============================================================

bind -n WheelUpPane if-shell -F -t = \
  '#{mouse_any_flag}' \
  'send-keys -M' \
  'if-shell -F -t = "#{pane_in_mode}" "send-keys -M" "copy-mode -e"'

bind -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down
